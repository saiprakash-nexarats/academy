name: nexarats-academy-infra

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: nexarats-academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexarats_academy}
      POSTGRES_USER: ${POSTGRES_USER:-nexarats_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexarats_secret_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexarats_user} -d ${POSTGRES_DB:-nexarats_academy}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexarats-network

  redis:
    image: redis:7.4-alpine
    container_name: nexarats-academy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-nexarats_redis_dev}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexarats_redis_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexarats-network

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: nexarats-academy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexarats-network

volumes:
  postgres_data:
    name: nexarats_postgres_data
  redis_data:
    name: nexarats_redis_data
  minio_data:
    name: nexarats_minio_data

networks:
  nexarats-network:
    name: nexarats-network
    driver: bridge
