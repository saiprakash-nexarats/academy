spring:
  application:
    name: core-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexarats_academy}
    username: ${DB_USERNAME:nexarats_user}
    password: ${DB_PASSWORD:nexarats_secret_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NexaratsHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%-5level] [%X{correlationId:-NONE}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.nexarats.academy: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
