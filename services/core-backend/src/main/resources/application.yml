spring:
  application:
    name: core-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexarats_academy}
    username: ${DB_USERNAME:nexarats_user}
    password: ${DB_PASSWORD:nexarats_secret_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NexaratsHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:nexarats_redis_dev}
      timeout: 2000ms

nexarats:
  auth:
    bootstrap-secret: ${NEXARATS_AUTH_BOOTSTRAP_SECRET:dev-bootstrap-secret-2026}
    jwt:
      issuer: nexarats-academy
      audience: nexarats-clients
      access-token-expiration-seconds: 900 # 15 minutes
      refresh-token-expiration-seconds: 604800 # 7 days
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    argon2:
      memory-cost: 16384 # 16 MB memory cost for dev/test efficiency on 8GB host
      time-cost: 3       # 3 iterations (OWASP compliant)
      parallelism: 1
      salt-length: 16
      hash-length: 32
    rate-limit:
      login-attempts-per-minute: 5
      general-requests-per-minute: 100
      fallback-strategy: ${RATE_LIMIT_FALLBACK_STRATEGY:memory}
    cookie:
      secure: ${COOKIE_SECURE:false}
  storage:
    avatar-upload-dir: ${AVATAR_UPLOAD_DIR:target/avatars}
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    connection-timeout-ms: ${CLAMAV_TIMEOUT_MS:1500}

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%-5level] [%X{correlationId:-NONE}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.nexarats.academy: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
