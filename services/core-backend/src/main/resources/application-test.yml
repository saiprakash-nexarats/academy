spring:
  datasource:
    url: jdbc:h2:mem:nexarats_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
