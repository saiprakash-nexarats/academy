spring:
  datasource:
    url: jdbc:h2:mem:nexarats_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

nexarats:
  storage:
    avatar-upload-dir: target/test-avatars
  clamav:
    host: 127.0.0.1
    port: 3310
    connection-timeout-ms: 500

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
