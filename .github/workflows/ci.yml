name: Nexarats Academy CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Web & Shared Tokens)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web Lint (oxlint)
        run: pnpm run lint:web

      - name: Run Web Unit & Component Tests
        run: pnpm run test:web

      - name: Verify Web Production Build (tsc + vite)
        run: pnpm run build:web

  backend:
    name: Core Backend (Java 21 & Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexarats_academy
          POSTGRES_USER: nexarats_user
          POSTGRES_PASSWORD: nexarats_secret_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexarats_user -d nexarats_academy"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install Database & Cache Client Utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client redis-tools

      - name: Export Test Environment Variables
        run: |
          echo "SPRING_PROFILES_ACTIVE=local" >> $GITHUB_ENV
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DB_NAME=nexarats_academy" >> $GITHUB_ENV
          echo "DB_USERNAME=nexarats_user" >> $GITHUB_ENV
          echo "DB_PASSWORD=nexarats_secret_dev" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/nexarats_academy" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_USERNAME=nexarats_user" >> $GITHUB_ENV
          echo "SPRING_DATASOURCE_PASSWORD=nexarats_secret_dev" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=nexarats_redis_dev" >> $GITHUB_ENV
          echo "SPRING_DATA_REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "SPRING_DATA_REDIS_PORT=6379" >> $GITHUB_ENV
          echo "SPRING_DATA_REDIS_PASSWORD=nexarats_redis_dev" >> $GITHUB_ENV

      - name: Wait for PostgreSQL and Redis Readiness
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U nexarats_user -d nexarats_academy && break || sleep 2
          done
          for i in {1..30}; do
            redis-cli -h localhost -p 6379 ping | grep -q PONG && break || sleep 2
          done
          redis-cli -h localhost -p 6379 config set requirepass nexarats_redis_dev
          redis-cli -h localhost -p 6379 -a nexarats_redis_dev ping | grep -q PONG

      - name: Maven Dependency Resolution & Compilation
        run: mvn clean compile

      - name: Run Unit, Context & Modulith Architecture Tests
        run: mvn test

      - name: Print Test Failures on Failure
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            if grep -qE "FAILURE|ERROR" "$f"; then
              echo "=== Failure in $f ==="
              cat "$f"
            fi
          done

      - name: Archive Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: services/core-backend/target/surefire-reports/
          if-no-files-found: ignore

  security:
    name: Repository Security & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Secret Exclusion (.gitignore check)
        run: |
          if git status --ignored | grep -E '\.env$|\.env\.local'; then
            echo "Private .env files must not be tracked!"
            exit 1
          fi
          echo "Secret exclusion check passed."
