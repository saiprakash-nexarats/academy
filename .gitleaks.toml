# ==============================================================================
# NEXARATS ACADEMY — GITLEAKS CONFIGURATION (.gitleaks.toml)
# Enterprise secret scanning configuration with narrow test fixture allowlists
# ==============================================================================

title = "Nexarats Academy Enterprise Secret Scanner"

[extend]
# Extends standard default rules

[allowlist]
description = "Allowlisted test directories, documentation, and synthetic non-production tokens"
paths = [
    '''docs/.*''',
    '''.*\.md''',
    '''services/core-backend/src/test/.*''',
    '''apps/web/src/.*/__tests__/.*'''
]
regexes = [
    '''nexarats_secret_dev''',
    '''nexarats_redis_dev''',
    '''minio_secret_dev''',
    '''dev-bootstrap-secret-2026''',
    '''StudentPass2026!''',
    '''SecurePass2026!''',
    '''AdminPass2026!'''
]
